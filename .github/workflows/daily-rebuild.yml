name: Daily Airtable bid rebuild
on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
jobs:
  rebuild:
    # Scheduled runs are opt-in: set repository variable DAILY_REBUILD=1 once the
    # secrets below exist. Manual runs (workflow_dispatch) always execute.
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_REBUILD == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check content & contrast
        run: npm run test && npm run check:contrast && npm run check:copy
      - name: Build fresh static site from Airtable
        # Keep this list identical to the Cloudflare Pages build variables, or a
        # scheduled deploy will differ from a Git deploy.
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_ANALYTICS_DOMAIN: ${{ vars.PUBLIC_ANALYTICS_DOMAIN }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
          NEWSLETTER_ENABLED: ${{ vars.NEWSLETTER_ENABLED }}
          DEMO_SEED: '0'
        run: npm run build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=tidewater --branch=main
