name: Verified release archive to Drive (opt-in)
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tidewater-drive-release
  cancel-in-progress: false
jobs:
  sync:
    # Safely skipped until OAuth credentials and folder access are configured.
    if: vars.DRIVE_SYNC_ENABLED == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: https://tidewater-6ik.pages.dev
          DEMO_SEED: '0'
          SITE_INDEXABLE: '0'
          NEWSLETTER_ENABLED: '0'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Wait for this commit on production (bounded)
        run: |
          node --input-type=module <<'JS'
          let ready=false;
          for(let attempt=0;attempt<20;attempt++){
            try{const r=await fetch('https://tidewater-6ik.pages.dev/release.json',{cache:'no-store'});if(r.ok&&(await r.json()).commit===process.env.GITHUB_SHA){ready=true;break;}}catch{}
            await new Promise(r=>setTimeout(r,15000));
          }
          if(!ready)throw new Error('This source commit is not deployed; Drive archive withheld');
          JS
      - name: Test actual production before archiving
        run: npm run test:e2e
        env:
          BASE_URL: https://tidewater-6ik.pages.dev
          DEMO_SEED: '0'
      - run: npm run release:archive
      - name: Synchronize and verify bytes in the established Drive folder
        run: node scripts/sync-drive.mjs
        env:
          DRIVE_SYNC_ENABLED: ${{ vars.DRIVE_SYNC_ENABLED }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-and-drive-receipt
          path: release-archive/
          retention-days: 30
